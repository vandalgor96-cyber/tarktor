<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8fd3f4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Сава">
<title>Тракторёнок Сава</title>
<style>
  :root{ --ink:#213547; --blue:#2f6fd0; --line:#cfe3ee; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%}
  html{-webkit-text-size-adjust:100%}
  body{
    background:linear-gradient(160deg,#eaf6fb 0%,#dceef8 100%);
    overscroll-behavior:none; touch-action:manipulation;
    color:var(--ink);
    font:16px/1.5 "Segoe UI", Roboto, system-ui, sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:14px 12px calc(18px + env(safe-area-inset-bottom));
  }
  .tabs{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; justify-content:center}
  .tab{
    border:2px solid var(--line); background:#fff; color:var(--ink);
    border-radius:999px; padding:9px 18px; font-size:15px; font-weight:600;
    cursor:pointer; transition:.15s;
  }
  .tab.on{background:var(--blue); border-color:var(--blue); color:#fff}
  .stage{position:relative; width:min(980px,100%)}
  canvas{
    display:block; width:100%; height:auto; border-radius:16px;
    background:#bfe6f7; box-shadow:0 16px 40px rgba(33,53,71,.18);
    touch-action:none;
  }
  .hud{
    position:absolute; left:12px; top:12px; right:12px;
    display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap;
    pointer-events:none; font-size:14px; font-weight:600;
  }
  .pill{
    background:rgba(255,255,255,.9); border-radius:14px; padding:6px 12px;
    box-shadow:0 4px 12px rgba(33,53,71,.12); display:flex; align-items:center; gap:8px;
  }
  .task{
    background:rgba(47,111,208,.94); color:#fff; border-radius:14px;
    padding:8px 14px; max-width:100%; box-shadow:0 6px 18px rgba(33,53,71,.2);
  }
  .task small{display:block; font-weight:400; opacity:.85; font-size:12.5px; margin-top:2px}
  .bar{width:88px; height:9px; border-radius:99px; background:#d7e5ee; overflow:hidden}
  .bar > i{display:block; height:100%; width:0%; background:linear-gradient(90deg,#8a6b3f,#4a3a26); transition:width .2s}
  .hint{
    position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
    background:rgba(33,53,71,.84); color:#fff; border-radius:999px;
    padding:7px 16px; font-size:13.5px; opacity:0; transition:opacity .25s; white-space:nowrap;
  }
  .hint.on{opacity:1}
  .pad{display:flex; gap:10px; margin-top:12px; justify-content:center; flex-wrap:wrap}
  .pad button{
    min-width:64px; height:56px; border-radius:14px; border:2px solid var(--line);
    background:#fff; font-size:20px; font-weight:700; color:var(--ink); cursor:pointer;
    box-shadow:0 6px 14px rgba(33,53,71,.10);
    touch-action:none; user-select:none;
  }
  .pad button:active{transform:translateY(1px); background:#eef6fb}
  .pad button.on{background:#ffe9a8; border-color:#f0c860; box-shadow:0 0 0 3px rgba(244,197,66,.35)}
  .rotate-tip{
    display:none; background:#fff6d8; color:#7a5b00; border:1px solid #ffe08a;
    border-radius:12px; padding:8px 14px; font-size:13px; margin-bottom:8px;
    text-align:center; max-width:420px;
  }
  @media (orientation: portrait) and (max-width: 900px){ .rotate-tip{display:block} }
  @media (max-width: 700px){
    body{padding:8px 6px 12px}
    .pad button{min-width:70px; height:62px; font-size:24px}
    .hud{gap:6px; font-size:12px; left:8px; top:8px; right:8px}
    .task{padding:6px 10px; font-size:12.5px}
    .task small{font-size:11px}
    .hint{font-size:12px; padding:6px 12px}
  }
  .palette{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; justify-content:center}
  .sw{width:44px; height:44px; border-radius:12px; cursor:pointer; border:3px solid #fff;
      box-shadow:0 4px 10px rgba(33,53,71,.18)}
  .sw.on{outline:3px solid var(--ink); outline-offset:2px}
  .tools{display:flex; gap:8px; margin-top:12px; justify-content:center; flex-wrap:wrap}
  .tools button{
    border:2px solid var(--line); background:#fff; border-radius:12px;
    padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer; color:var(--ink);
  }
  .off{display:none !important}
  .err{
    position:fixed; left:0; right:0; bottom:0; background:#b5533f; color:#fff;
    font:13px/1.4 monospace; padding:10px 14px; white-space:pre-wrap; display:none; z-index:99;
  }
  .foot{margin-top:12px; color:#6b8299; font-size:12.5px; text-align:center}
  kbd{background:#fff; border:1px solid var(--line); border-bottom-width:2px; border-radius:6px; padding:1px 6px; font-size:12px}

  /* ---------- стартовое меню ---------- */
  .menu{
    position:fixed; inset:0; z-index:60; padding:22px;
    background:linear-gradient(160deg,#eaf6fb 0%,#cfe6f5 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center;
  }
  .menu.off{display:none}
  .menu h1{margin:0; font-size:clamp(22px,5vw,38px); color:#213547; letter-spacing:.5px}
  .menu p{margin:0; color:#5a7488; font-size:15px}
  .menu-cards{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:8px}
  .card{
    width:min(280px,42vw); min-height:158px; border-radius:22px; border:3px solid #fff;
    background:#fff; color:#213547; font-size:36px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    box-shadow:0 16px 36px rgba(33,53,71,.16); transition:transform .12s;
    font-family:inherit;
  }
  .card span{font-size:20px; font-weight:700}
  .card small{font-size:12.5px; color:#7b93a6; font-weight:400; padding:0 12px; line-height:1.3}
  .card:active{transform:scale(.97)}
  .menu-foot{margin-top:6px}
  .menu-foot button{
    border:2px solid #cfe3ee; background:#fff; border-radius:999px; padding:10px 18px;
    font-size:14px; font-weight:600; color:#213547; cursor:pointer; font-family:inherit;
  }

  /* ---------- полный экран ---------- */
  body.fs{padding:0; background:#0b1620; overflow:hidden}
  body.fs .tabs, body.fs .foot, body.fs .rotate-tip{display:none}
  body.fs .stage{width:100vw; height:100vh; display:flex; align-items:center; justify-content:center}
  body.fs canvas{
    width:min(100vw, calc(100vh * 1.8148));
    height:auto; max-height:100vh;
    border-radius:0; box-shadow:none;
  }
  body.fs .pad{
    position:fixed; left:0; right:0; bottom:calc(6px + env(safe-area-inset-bottom));
    margin:0; padding:0 6px; z-index:20;
  }
  body.fs .pad button{background:rgba(255,255,255,.93)}
  body.fs #stagePaint{height:auto; padding-top:6px}
  body.fs #paint{width:min(100vw, calc((100vh - 250px) * 1.7778)); margin:0 auto}

  /* ---------- компактный режим в полном экране ---------- */
  body.fs .hud{left:6px; top:6px; right:6px; gap:4px; font-size:10.5px; font-weight:600}
  body.fs .pill{padding:3px 7px; border-radius:10px; gap:4px}
  body.fs .task{padding:4px 8px; font-size:11px; border-radius:10px; line-height:1.2}
  body.fs .task small{font-size:9px; margin-top:1px; opacity:.8}
  body.fs .bar{width:42px; height:6px}
  body.fs .pad{bottom:calc(2px + env(safe-area-inset-bottom)); gap:5px}
  body.fs .pad button{
    min-width:44px; height:40px; font-size:16px; border-radius:9px;
    background:rgba(255,255,255,.82); box-shadow:0 2px 6px rgba(33,53,71,.18);
  }
  body.fs .hint{bottom:calc(50px + env(safe-area-inset-bottom)); font-size:11px; padding:4px 10px}
  @media (max-width: 720px){
    body.fs .pad button{min-width:40px; height:36px; font-size:15px}
    body.fs .hud{font-size:10px}
  }
  body.fs .pill .lbl{display:none}
  #btnHose, #btnFuel{min-width:116px; font-size:17px}
  body.fs #btnHose, body.fs #btnFuel{min-width:86px; font-size:12.5px}
  @media (max-width:700px){ #btnHose, #btnFuel{min-width:112px} }
</style>
</head>
<body>

<div class="menu" id="menu">
  <h1>Тракторёнок Сава</h1>
  <p>Чем займёмся?</p>
  <div class="menu-cards">
    <button class="card" id="menuDrive">🚜<span>Поехать</span><small>задания, прицеп, мойка,<br>день и ночь, зима и лето</small></button>
    <button class="card" id="menuPaint">🎨<span>Раскраска</span><small>трактор, прицеп<br>и коровка — заливай цветом</small></button>
  </div>
  <div class="menu-foot"><button id="menuFull">⛶ Во весь экран</button></div>
</div>

<div class="tabs">
  <button class="tab on" id="tabDrive">🚜 Задания</button>
  <button class="tab" id="tabPaint">🎨 Раскраска</button>
</div>

<div class="rotate-tip" id="rotateTip">Поверни телефон горизонтально — так удобнее играть</div>

<div class="stage" id="stageDrive">
  <canvas id="game" width="980" height="540"></canvas>
  <div class="hud">
    <div class="task" id="taskBox">Задание</div>
    <div class="pill" id="dayPill">☀️ день</div>
    <div class="pill" id="seasonPill">🌿 лето</div>
    <div class="pill">⭐ <span id="score">0</span></div>
    <div class="pill"><span class="lbl">Грязь</span> <span class="bar"><i id="dirtBar"></i></span></div>
    <div class="pill">💧 <span class="bar"><i id="waterBar"></i></span></div>
    <div class="pill">⛽ <span class="bar"><i id="fuelBar"></i></span></div>
  </div>
  <div class="hint" id="hint"></div>
</div>

<div class="pad" id="padDrive">
  <button id="btnLeft">◀</button>
  <button id="btnRight">▶</button>
  <button id="btnWash">🧽 губка</button>
  <button id="btnHose">🚿 шланг</button>
  <button id="btnFuel">⛽ заправка</button>
  <button id="btnHorn">📣</button>
  <button id="btnMusic">🔊</button>
  <button id="btnFull" title="Во весь экран">⛶</button>
  <button id="btnMenu" title="Меню">☰</button>
</div>

<div class="stage off" id="stagePaint">
  <canvas id="paint" width="960" height="540"></canvas>
</div>

<div class="palette off" id="palette">
  <div class="sw on" data-c="#2f6fd0" style="background:#2f6fd0"></div>
  <div class="sw" data-c="#8fd3f4" style="background:#8fd3f4"></div>
  <div class="sw" data-c="#3fae6a" style="background:#3fae6a"></div>
  <div class="sw" data-c="#f4c542" style="background:#f4c542"></div>
  <div class="sw" data-c="#ef7d4a" style="background:#ef7d4a"></div>
  <div class="sw" data-c="#e05c5c" style="background:#e05c5c"></div>
  <div class="sw" data-c="#8a6b3f" style="background:#8a6b3f"></div>
  <div class="sw" data-c="#4a4a4a" style="background:#4a4a4a"></div>
  <div class="sw" data-c="#ffffff" style="background:#ffffff"></div>
</div>

<div class="tools off" id="tools">
  <button id="btnClear">Очистить</button>
  <button id="btnSave">Скачать PNG</button>
  <button id="btnPaintDrive">🚜 Поехать</button>
  <button id="btnPaintMenu">☰ Меню</button>
</div>

<div class="foot" id="foot">
  <kbd>←</kbd> <kbd>→</kbd> — ехать · <kbd>E</kbd> — губка · <kbd>Q</kbd> — шланг · <kbd>Space</kbd> — бибикнуть
</div>

<div class="err" id="err"></div>

<script>
window.onerror = function (msg, src, line, col) {
  var box = document.getElementById('err');
  box.style.display = 'block';
  box.textContent = 'Ошибка: ' + msg + '  (строка ' + line + ':' + col + ')';
};

/* ================= утилиты ================= */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function mixC(c1, c2, t) {
  return [Math.round(lerp(c1[0], c2[0], t)), Math.round(lerp(c1[1], c2[1], t)), Math.round(lerp(c1[2], c2[2], t))];
}
function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
function shade(c, k) { return [clamp(c[0] * k, 0, 255) | 0, clamp(c[1] * k, 0, 255) | 0, clamp(c[2] * k, 0, 255) | 0]; }

var cv = document.getElementById('game');
var ctx = cv.getContext('2d');

/* ================= звук ================= */
var AC = null, masterGain = null, engine = null;
var MUSIC = { on: true };
var ENGINE_VOL = 0.45;   /* громкость мотора: 1 = как было */

function audio() {
  if (!AC) { var C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function ensureMaster() {
  var ac = audio(); if (!ac) return null;
  if (!masterGain) {
    masterGain = ac.createGain();
    masterGain.gain.value = 0.6;
    masterGain.connect(ac.destination);
  }
  return masterGain;
}
function tone(freq, dur, type, vol, when, sweepTo) {
  var ac = audio(), m = ensureMaster();
  if (!ac || !m || !freq) return;
  var t = (when != null) ? when : ac.currentTime;
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.06, dur * 0.9));
  o.connect(g); g.connect(m);
  o.start(t); o.stop(t + dur + 0.05);
}

/* мотор: живёт постоянно, рычит по оборотам */
function ensureEngine() {
  var ac = audio(), m = ensureMaster();
  if (!ac || !m || engine) return;

  var g = ac.createGain(); g.gain.value = 0;
  var lp = ac.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 520; lp.Q.value = 6;

  var o1 = ac.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 40;
  var o2 = ac.createOscillator(); o2.type = 'square'; o2.frequency.value = 20; o2.detune.value = 9;

  /* шумовая «механика» трактора */
  var len = Math.floor(ac.sampleRate * 1.0);
  var buf = ac.createBuffer(1, len, ac.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.5;
  var noise = ac.createBufferSource();
  noise.buffer = buf; noise.loop = true;
  var nbp = ac.createBiquadFilter();
  nbp.type = 'bandpass'; nbp.frequency.value = 220; nbp.Q.value = 0.8;
  var ng = ac.createGain(); ng.gain.value = 0.3;

  /* «тарахтение»: пульсация громкости */
  var lfo = ac.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 8;
  var lfoG = ac.createGain(); lfoG.gain.value = 0;
  lfo.connect(lfoG); lfoG.connect(g.gain);

  o1.connect(lp); o2.connect(lp);
  noise.connect(nbp); nbp.connect(ng); ng.connect(lp);
  lp.connect(g); g.connect(m);

  o1.start(); o2.start(); noise.start(); lfo.start();

/* ================= грязь ================= */
function addDirt(amount) {
  var need = amount;
  for (var i = 0; i < spots.length && need > 0; i++) {
    if (spots[i].a < 1) { var add = Math.min(1 - spots[i].a, need); spots[i].a += add; need -= add; }
  }
  while (need > 0 && spots.length < 26) {
    var z = Math.random(), lx, ly;
    if (z < 0.24) { lx = -100 + Math.random() * 148; ly = -96 + Math.random() * 40; }
    else if (z < 0.40) { lx = -92 + Math.random() * 84; ly = -158 + Math.random() * 54; }
    else if (z < 0.48) { lx = 48 + Math.random() * 70; ly = -92 + Math.random() * 32; }
    else if (z < 0.60) { lx = -116 + Math.random() * 100; ly = -92 + Math.random() * 92; }
    else if (z < 0.68) { lx = 38 + Math.random() * 72; ly = -70 + Math.random() * 70; }
    else if (z < 0.88) { lx = -300 + Math.random() * 190; ly = -124 + Math.random() * 62; }
    else if (z < 0.94) { lx = -290 + Math.random() * 56; ly = -58 + Math.random() * 56; }
    else { lx = -176 + Math.random() * 56; ly = -58 + Math.random() * 56; }
    var a = Math.min(1, need);
    spots.push({ lx: lx, ly: ly, r: 11 + Math.random() * 13, rot: Math.random() * 3, sd: Math.random() * 10, a: a });
    need -= a;
  }
  recalcDirt();
}
function recalcDirt() {
  var sum = 0;
  for (var i = 0; i < spots.length; i++) sum += spots[i].a;
  dirt = clamp(sum * 100 / DIRT_CAP, 0, 100);
}
function tractorTilts() {
  var ty = groundY(camX), ang = slopeAt(camX);
  return { y: ty, ang: ang };
}
function toLocal(px, py) {
  var t = tractorTilts(), dx = px - TX, dy = py - t.y;
  var c = Math.cos(-t.ang), s = Math.sin(-t.ang);
  return { x: dx * c - dy * s, y: dx * s + dy * c, ty: t.y, ang: t.ang };
}
function scrubAt(px, py, dt, rad, mult, isHose) {
  var L = toLocal(px, py);
  var radius = rad || 26;
  var inWash = nearestWash() ? 1 : 0;
  var power = (inWash ? 2.6 : 1.3) * dt * (mult || 1);
  var touched = false;

  for (var i = spots.length - 1; i >= 0; i--) {
    var s = spots[i];
    var dx = L.x - s.lx, dy = L.y - s.ly;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d >= radius + s.r) continue;
    var k = 1 - d / (radius * 2.2 + s.r);

    if (isHose) {
      if (lather < 1) continue;              /* сухую грязь шлангом не смыть */
      s.a -= power * k;
      lather = clamp(lather - power * 7 * k, 0, 100);
    } else {
      var removed = Math.min(s.a, power * k);
      s.a -= removed;
      lather = clamp(lather + removed * 9, 0, 100);   /* грязь превращается в пену */
    }
    touched = true;
    if (s.a <= 0.03) spots.splice(i, 1);
  }

  if (isHose && lather > 0) {
    lather = clamp(lather - 16 * dt * (mult || 1), 0, 100);
  }
  if (isHose && snowCover > 0) {
    snowCover = clamp(snowCover - 55 * dt * (mult || 1), 0, 100);
  }

  if (touched) {
    recalcDirt();
    for (var f = 0; f < 2; f++) {
      foam.push({ x: px + (Math.random() - 0.5) * 34, y: py + (Math.random() - 0.5) * 28,
                  r: 3 + Math.random() * 7, vy: -18 - Math.random() * 26, life: 1 });
    }
  }

  if (dirt <= 0.5 && lather <= 2 && !wasClean) {
    wasClean = true;
    washChime();
    say('clean', true);
    for (var sp = 0; sp < 16; sp++) {
      sparks.push({ x: TX - 100 + Math.random() * 220, y: L.ty - 150 + Math.random() * 120,
                    vx: (Math.random() - 0.5) * 70, vy: -30 - Math.random() * 50, life: 1 });
    }
  } else if (dirt > 0.5 || lather > 2) {
    wasClean = false;
  }
}

  return {

function drawFuelHose() {
  if (!nozzle) return;
  var f = nearestFuel();
  if (!f) return;
  var gy = groundY(f.x);
  var px = (f.x - camX + TX) + 30, py = gy - 96;
  var cap = localToScreen(34, -74);

  /* шланг дугой */
  ctx.strokeStyle = '#2b2f35';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.quadraticCurveTo((px + cap.x) / 2, Math.max(py, cap.y) + 34, cap.x, cap.y);
  ctx.stroke();
  ctx.strokeStyle = '#4a5158';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  /* топливо бежит по шлангу */
  if (pouring) {
    ctx.save();
    ctx.setLineDash([9, 11]);
    ctx.lineDashOffset = -(time * 90) % 20;
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.quadraticCurveTo((px + cap.x) / 2, Math.max(py, cap.y) + 34, cap.x, cap.y);
    ctx.stroke();
    ctx.restore();

    for (var q = 0; q < 3; q++) {
      ctx.fillStyle = 'rgba(255,214,102,.85)';
      ctx.beginPath();
      ctx.arc(cap.x + (Math.random() - 0.5) * 16, cap.y + 6 + Math.random() * 12,
              1.5 + Math.random() * 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* пистолет в баке */
  ctx.save();
  ctx.translate(cap.x, cap.y);
  ctx.rotate(-0.5);
  ctx.fillStyle = '#3a3f45';
  ctx.beginPath(); roundRect(ctx, -4, -12, 9, 20, 3); ctx.fill();
  ctx.fillStyle = '#c8ccd2';
  ctx.beginPath(); roundRect(ctx, -3, -16, 7, 8, 2); ctx.fill();
  ctx.restore();
}

function nearAnyStation(x) {

    if (Math.abs(x - WASHES[i].x) < 540) return true;

  }
  return false;
}

  /* сутки */
  dayClock += dt;
  phase = (dayClock % DAY_CYCLE) / DAY_CYCLE;
  var sunA = (phase - 0.25) * Math.PI * 2;
  var alt = Math.sin(sunA);
  light = clamp((alt + 0.16) / 1.16, 0, 1);

  /* сезоны */
  seasonClock += dt;
  if (seasonClock >= SEASON_LEN) nextSeason();
  winter += clamp(wantSeason.winter - winter, -dt * 0.25, dt * 0.25);
  autumn += clamp(wantSeason.autumn - autumn, -dt * 0.25, dt * 0.25);
  spring += clamp(wantSeason.spring - spring, -dt * 0.25, dt * 0.25);

  /* движение */
  var accel = 0;
  if (keys.ArrowRight || keys.KeyD) accel += 520;
  if (keys.ArrowLeft || keys.KeyA) accel -= 520;
  if (fuel <= 0) accel = clamp(accel, -170, 170);   /* без топлива — только ползком */
  speed += accel * dt;
  speed -= speed * (2.0 - winter * 1.1) * dt;   /* зимой скользит */
  speed = clamp(speed, -180, 430);
  if (fuel <= 0) speed = clamp(speed, -95, 95);
  camX += speed * dt;
  if (camX < 0) { camX = 0; speed = Math.max(0, speed); }
  wheelAng += speed * dt / 42;
  if (fuel > 0) {
    fuel = clamp(fuel - (0.10 + 0.42 * clamp(Math.abs(speed) / 430, 0, 1)) * dt, 0, 100);
  }
  var fst = nearestFuel();
  if (!fst) { nozzle = false; pouring = false; }
  if (fst && hoseOn) { hoseOn = false; syncWashButtons(); }   /* вода на АЗС отключается */

  var Lp = toLocal(ptr.x, ptr.y);
  var onTractor = Lp.x > -130 && Lp.x < 140 && Lp.y > -240 && Lp.y < 30;
  pouring = !!(nozzle && fst && ptr.down && onTractor);

  if (pouring && fuel < 100) {
    fuel = clamp(fuel + 34 * dt, 0, 100);
    if (fuel >= 100 && !nozzleFullSaid) { nozzleFullSaid = true; say('full', true); }
  }
  if (fuel < 99) nozzleFullSaid = false;
  syncFuelButton();
  updateEngine();

  /* брызги из-под колёс */
  if (Math.abs(speed) > 120 && Math.random() < 0.55) {
    var g0 = groundY(camX);
    mud.push({ x: TX + 74, y: g0 - 6, vx: -speed * 0.25 - Math.random() * 60,
               vy: -60 - Math.random() * 90, r: 2 + Math.random() * 4, life: 1 });
  }
  for (var i = mud.length - 1; i >= 0; i--) {
    var p = mud[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 520 * dt; p.life -= dt * 1.6;
    if (p.life <= 0) mud.splice(i, 1);
  }

  /* лужи */
  for (var j = 0; j < PUDDLES.length; j++) {
    var pd = PUDDLES[j];
    if (winter < 0.35 && Math.abs(camX - pd.x) < pd.w * 0.5 && Math.abs(speed) > 90) {
      addDirt(6 * dt * Math.min(1, Math.abs(speed) / 300));
    }
  }

  /* яблоки */
  for (var k = 0; k < APPLES.length; k++) {
    var ap = APPLES[k];
    if (!ap.taken && Math.abs(camX - ap.x) < 44) { ap.taken = true; ding(); }
  }

  /* мытьё */
  spraying = false;
  if (hoseOn && (ptr.down || ptr.inside) && ptr.inside && water > 0) {
    spraying = true;
    water = clamp(water - 24 * dt, 0, 100);
    scrubAt(ptr.x, ptr.y, dt, 48, 2.8, true);
  } else if (ptr.down && !hoseOn) {
    scrubAt(ptr.x, ptr.y, dt, 26, 1, false);
  }
  if (nearestWash()) water = clamp(water + 32 * dt, 0, 100);

  /* пена держится только у мойки, по дороге подсыхает */
  if (!nearestWash() && lather > 0) {
    lather = clamp(lather - 2 * dt, 0, 100);
  }

  for (var f = foam.length - 1; f >= 0; f--) {
    var fo = foam[f]; fo.y += fo.vy * dt; fo.vy *= 0.96; fo.life -= dt * 0.9;
    if (fo.life <= 0) foam.splice(f, 1);
  }
  for (var sp = sparks.length - 1; sp >= 0; sp--) {
    var sk = sparks[sp];
    sk.x += sk.vx * dt; sk.y += sk.vy * dt; sk.vy += 60 * dt; sk.life -= dt * 0.8;
    if (sk.life <= 0) sparks.splice(sp, 1);
  }
  for (var c = confetti.length - 1; c >= 0; c--) {
    var cf = confetti[c];
    cf.x += cf.vx * dt; cf.y += cf.vy * dt; cf.vy += 260 * dt; cf.rot += dt * 6; cf.life -= dt * 0.7;
    if (cf.life <= 0) confetti.splice(c, 1);
  }

  /* снег */
  if (winter > 0.15) {
    if (Math.random() < winter * 2.8) {
      snow.push({ x: Math.random() * W, y: -10, r: 1.5 + Math.random() * 2.5,
                  vy: 26 + Math.random() * 34, vx: -8 - Math.random() * 16, life: 1 });
    }
    for (var sn = snow.length - 1; sn >= 0; sn--) {
      var s2 = snow[sn];
      s2.x += (s2.vx - speed * 0.06) * dt; s2.y += s2.vy * dt;
      if (s2.y > groundY(camX + s2.x - TX) + 6 || s2.x < -20 || s2.x > W + 20) snow.splice(sn, 1);
    }
  } else if (snow.length) snow.length = 0;

  /* листопад */
  if (autumn > 0.25 && Math.random() < autumn * 1.3) {
    leaves.push({ x: Math.random() * W, y: -12, r: 3 + Math.random() * 3,
                  vy: 40 + Math.random() * 40, vx: -20 - Math.random() * 30,
                  rot: Math.random() * 6, col: Math.random() < 0.5 ? '#d9822b' : '#c9563f' });
  }
  for (var lf = leaves.length - 1; lf >= 0; lf--) {
    var l3 = leaves[lf];
    l3.x += (l3.vx - speed * 0.05) * dt;
    l3.y += l3.vy * dt;
    l3.rot += dt * 3;
    if (l3.y > groundY(camX + l3.x - TX) + 4 || l3.x < -20) leaves.splice(lf, 1);
  }

  /* следы на снегу */
  if (winter > 0.35 && Math.abs(speed) > 40) {
    trackClock += dt;
    if (trackClock > 0.07) {
      trackClock = 0;
      tracks.push({ x: camX - (speed > 0 ? 26 : -26), life: 1 });
    }
  }
  for (var tr = tracks.length - 1; tr >= 0; tr--) {
    tracks[tr].life -= dt / 16;
    if (tracks[tr].life <= 0) tracks.splice(tr, 1);
  }

  /* снег налипает на машину в движении */
  if (winter > 0.35 && Math.abs(speed) > 30) {
    snowCover = clamp(snowCover + winter * 7 * dt, 0, 100);
  }
  if (winter < 0.2 && snowCover > 0) {
    snowCover = clamp(snowCover - 8 * dt, 0, 100);
  }

  /* птицы и бабочки */
  for (var b = 0; b < birds.length; b++) {
    var bd = birds[b];
    bd.x += bd.v * dt;
    if (bd.x > W + 80) { bd.x = -80; bd.y = 70 + Math.random() * 150; }
  }
  for (var fb = 0; fb < butterflies.length; fb++) {
    var bt = butterflies[fb];
    bt.x += bt.v * dt;
    bt.ph += dt * 3;
    if (bt.x > W + 40) { bt.x = -40; bt.y = 360 + Math.random() * 70; }
  }

  /* звуковое окружение */
  birdTimer -= dt;
  if (birdTimer <= 0) { chirp(); birdTimer = 4 + Math.random() * 7; }
  cricketTimer -= dt;
  if (cricketTimer <= 0) { cricket(); cricketTimer = 1.0 + Math.random() * 1.0; }

  /* задание */
  if (task && !taskDone && camX >= taskTarget) {
    if (task.clean && (dirt > 15 || lather > 20)) {
      msgText = 'Слишком грязно! Сначала на мойку';
      msgTimer = 1.6;
      taskTarget = camX + 260;
      var guardRetry = 0;
      while (guardRetry++ < 40 && nearAnyStation(taskTarget)) taskTarget += 420;
      updateTaskBox();
    } else completeTask();
  }
  if (msgTimer > 0) msgTimer -= dt;

  /* подсказки и HUD */
  var hint = '';
  var fh = nearestFuel();
  if (fuel <= 0.5 && !fh) hint = 'Топливо кончилось — ищи АЗС';
  else if (fh && fuel >= 99.5) hint = 'Бак полный, можно ехать';
  else if (fh && !nozzle) hint = 'Жми ⛽ — взять пистолет';
  else if (fh && nozzle && !pouring) hint = 'Теперь жми на трактор — польётся топливо';
  else if (fh && nozzle && pouring) hint = 'Льём топливо…';
  else if (hoseOn && water <= 0.5) hint = 'Вода кончилась — подъезжай к мойке';
  else if (hoseOn) hint = lather > 3 ? 'Смывай пену струёй' : 'Пены нет — сначала намыль губкой';
  else if (spongeOn) hint = dirt > 3 ? 'Намыливай губкой: грязь уходит в пену'
                                     : (lather > 20 ? 'Теперь смой пену шлангом (Q)' : 'Блеск! Можно ехать');
  else if (nearestWash()) hint = 'Мойка: E — губка, Q — шланг';
  else if (dirt > 40) hint = 'Грязный! Жми E (губка) или Q (шланг)';
  else if (!task) hint = 'Все рейсы сделаны. Катайся в своё удовольствие!';
  setHint(hint);

  if (dirt > 55 && !saidDirty) { saidDirty = true; say('dirty'); }
  if (dirt < 20) saidDirty = false;
  var nw = nearestWash();
  if (nw && !saidWash) { saidWash = true; say('wash'); }
  if (!nw) saidWash = false;
  if (water <= 0.5 && !saidEmpty) { saidEmpty = true; say('empty'); }
  if (water > 20) saidEmpty = false;

  var fNear = nearestFuel();
  if (fNear && fuel < 95 && !saidFuel) { saidFuel = true; say('fuel'); }
  if (!fNear) saidFuel = false;
  if (fuel < 20 && !saidLowFuel) { saidLowFuel = true; say('lowfuel'); }
  if (fuel > 45) saidLowFuel = false;

  document.getElementById('score').textContent = score;
  document.getElementById('dirtBar').style.width = dirt + '%';
  document.getElementById('waterBar').style.width = water + '%';
  document.getElementById('fuelBar').style.width = fuel + '%';
  var compact = document.body.classList.contains('fs');
  var dayEl = document.getElementById('dayPill');
  var seaEl = document.getElementById('seasonPill');
  var sName = SEASON_NAMES[seasonIdx];
  var sIcon = sName === 'зима' ? '❄️' : (sName === 'осень' ? '🍂' : (sName === 'весна' ? '🌸' : '🌿'));
  if (compact) {
    dayEl.textContent = light > 0.6 ? '☀️' : (light > 0.25 ? '🌇' : '🌙');
    seaEl.textContent = sIcon;
  } else {
    dayEl.textContent = light > 0.6 ? '☀️ день' : (light > 0.25 ? '🌇 вечер' : '🌙 ночь');
    seaEl.textContent = sIcon + ' ' + sName;
  }
  updateTaskBox();
}

var lastHint = null;
function setHint(t) {
  if (t === lastHint) return;
  lastHint = t;
  var el = document.getElementById('hint');
  el.textContent = t;
  el.className = 'hint' + (t ? ' on' : '');
}

/* лицо трактора */
function drawFace(ctx, bx, by) {
  var eyeY = by - 82;
  var lx = bx + 64, rx = bx + 98, er = 13;
  var look = clamp(speed / 320, -1, 1) * 4.5;
  var blink = (time % 5.4) > 5.18;

  // белки
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = 'rgba(18,48,96,.6)';
  ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.arc(lx, eyeY, er, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(rx, eyeY, er, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  if (blink) {
    ctx.strokeStyle = '#1b3a52'; ctx.lineWidth = 3.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(lx - 8, eyeY); ctx.lineTo(lx + 8, eyeY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(rx - 8, eyeY); ctx.lineTo(rx + 8, eyeY); ctx.stroke();
  } else {
    ctx.fillStyle = '#1b2a3a';
    ctx.beginPath(); ctx.arc(lx + look, eyeY + 2, 6.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(rx + look, eyeY + 2, 6.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.beginPath(); ctx.arc(lx + look - 2.2, eyeY - 1, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(rx + look - 2.2, eyeY - 1, 2.2, 0, Math.PI * 2); ctx.fill();
  }

  // брови
  ctx.strokeStyle = '#1b3a52'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(lx - 8, eyeY - 20); ctx.quadraticCurveTo(lx, eyeY - 27, lx + 8, eyeY - 20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(rx - 8, eyeY - 20); ctx.quadraticCurveTo(rx, eyeY - 27, rx + 8, eyeY - 20); ctx.stroke();

  // улыбка
  ctx.strokeStyle = '#1b3a52'; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(bx + 68, by - 68);
  ctx.quadraticCurveTo(bx + 81, by - 54, bx + 94, by - 68);
  ctx.stroke();

  // румянец
  ctx.fillStyle = 'rgba(240,130,142,.42)';
  ctx.beginPath(); ctx.ellipse(bx + 52, by - 64, 8.5, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(bx + 110, by - 64, 8.5, 5, 0, 0, Math.PI * 2); ctx.fill();
}

/* ================= отрисовка мира ================= */
var skyDay = [[143, 211, 244], [232, 247, 252]];
var skyNight = [[10, 16, 40], [32, 44, 74]];
var grassSummer = [121, 191, 111], grassWinter = [238, 244, 250];
var roadColor = [201, 177, 138];

function drawSky() {
  var top = mixC(skyNight[0], skyDay[0], light);
  var bot = mixC(skyNight[1], skyDay[1], light);
  var dusk = Math.max(0, 1 - Math.abs(light - 0.22) / 0.26);
  top = mixC(top, [243, 152, 95], dusk * 0.55);
  bot = mixC(bot, [255, 205, 155], dusk * 0.7);

  var g = ctx.createLinearGradient(0, 0, 0, BASE_Y + 80);
  g.addColorStop(0, rgb(top));
  g.addColorStop(1, rgb(bot));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  /* звёзды */
  var starA = clamp(1 - light * 1.6, 0, 1);
  if (starA > 0.02) {
    for (var i = 0; i < 90; i++) {
      var sx = hash(i * 1.7) * W, sy = hash(i * 3.1) * 300;
      var tw = 0.55 + 0.45 * Math.sin(time * 2 + i);
      ctx.globalAlpha = starA * tw;
      ctx.fillStyle = '#fff';
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  /* солнце и луна */
  var sunX = W * 0.5 - Math.cos((phase - 0.25) * Math.PI * 2) * W * 0.42;
  var sunY = 300 - Math.sin((phase - 0.25) * Math.PI * 2) * 210;
  if (light > 0.05) {
    ctx.globalAlpha = clamp(light * 1.4, 0, 1);
    ctx.fillStyle = '#ffe9a8';
    ctx.beginPath(); ctx.arc(sunX, sunY, 42, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = clamp(light * 0.35, 0, 1);
    ctx.beginPath(); ctx.arc(sunX, sunY, 62, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (light < 0.6) {
    var moonX = W * 0.5 + Math.cos((phase - 0.25) * Math.PI * 2) * W * 0.4;
    var moonY = 260 + Math.sin((phase - 0.25) * Math.PI * 2) * 170;
    ctx.globalAlpha = clamp((0.6 - light) * 1.8, 0, 1);
    ctx.fillStyle = '#eef3ff';
    ctx.beginPath(); ctx.arc(moonX, moonY, 26, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgb(mixC(skyNight[1], skyDay[1], light));
    ctx.beginPath(); ctx.arc(moonX + 10, moonY - 6, 22, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawHills(par, baseY, amp, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (var x = 0; x <= W; x += 24) {
    var y = baseY + Math.sin((x + camX * par) / (320 / par)) * amp;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
}

function treeColor(kind, k) {
  var summer = kind === 'pine' ? [46, 110, 68] : [92, 154, 74];
  var autumnC = kind === 'pine' ? [58, 108, 70] : [206, 124, 44];
  var winterC = [226, 238, 246];
  var base = mixC(shade(summer, k), autumnC, autumn);
  return rgb(mixC(base, winterC, winter));
}

function drawTree(x, y, s, kind, par) {
  if (x < -90 || x > W + 90) return;
  var h = 64 * s;
  /* ствол */
  ctx.fillStyle = rgb(mixC([122, 90, 58], [110, 96, 86], winter));
  ctx.fillRect(x - 3 * s, y - h * 0.35, 6 * s, h * 0.4);
  if (kind === 'pine') {
    for (var i = 0; i < 3; i++) {
      var w = (26 - i * 6) * s, yy = y - h * 0.3 - i * h * 0.24;
      ctx.fillStyle = treeColor('pine', 0.85 + i * 0.12);
      ctx.beginPath();
      ctx.moveTo(x, yy - h * 0.42);
      ctx.lineTo(x + w, yy);
      ctx.lineTo(x - w, yy);
      ctx.closePath();
      ctx.fill();
      if (winter > 0.25) {
        ctx.fillStyle = 'rgba(255,255,255,' + (winter * 0.85) + ')';
        ctx.beginPath();
        ctx.moveTo(x, yy - h * 0.42);
        ctx.lineTo(x + w * 0.55, yy - h * 0.12);
        ctx.lineTo(x - w * 0.55, yy - h * 0.12);
        ctx.closePath();
        ctx.fill();
      }
    }
  } else {
    var r = 20 * s;
    ctx.fillStyle = treeColor('leaf', 1);
    ctx.beginPath();
    ctx.arc(x, y - h * 0.62, r, 0, Math.PI * 2);
    ctx.arc(x - r * 0.8, y - h * 0.45, r * 0.75, 0, Math.PI * 2);
    ctx.arc(x + r * 0.8, y - h * 0.45, r * 0.75, 0, Math.PI * 2);
    ctx.fill();
    if (winter > 0.3) {
      ctx.fillStyle = 'rgba(255,255,255,' + (winter * 0.75) + ')';
      ctx.beginPath();
      ctx.arc(x, y - h * 0.68, r * 0.7, Math.PI, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawBush(x, y, s) {
  if (x < -60 || x > W + 60) return;
  var r = 15 * s;
  ctx.fillStyle = rgb(mixC(mixC(shade([104, 168, 88], 0.95), [198, 116, 40], autumn),
                          [232, 242, 248], winter));
  ctx.beginPath();
  ctx.arc(x, y - r * 0.6, r, 0, Math.PI * 2);
  ctx.arc(x - r * 0.9, y - r * 0.2, r * 0.8, 0, Math.PI * 2);
  ctx.arc(x + r * 0.9, y - r * 0.2, r * 0.8, 0, Math.PI * 2);
  ctx.fill();
  if (winter > 0.3) {
    ctx.fillStyle = 'rgba(255,255,255,' + (winter * 0.8) + ')';
    ctx.beginPath();
    ctx.arc(x, y - r * 0.85, r * 0.8, Math.PI, Math.PI * 2);
    ctx.fill();
  }
}

function drawGroundAndRoad() {
  var grassC = mixC(mixC(grassSummer, [196, 158, 76], autumn), grassWinter, winter);
  var g = ctx.createLinearGradient(0, BASE_Y - 120, 0, H);
  g.addColorStop(0, rgb(shade(grassC, 1.06)));
  g.addColorStop(1, rgb(shade(grassC, 0.82)));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (var x = 0; x <= W; x += 6) ctx.lineTo(x, groundY(camX + x - TX));
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();

  /* дорога полосой по кривой */
  ctx.beginPath();
  for (var x2 = 0; x2 <= W; x2 += 6) {
    var y2 = groundY(camX + x2 - TX);
    if (x2 === 0) ctx.moveTo(x2, y2); else ctx.lineTo(x2, y2);
  }
  ctx.lineWidth = 36;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = rgb(mixC(roadColor, [236, 240, 246], winter * 0.7));
  ctx.stroke();

  /* разметка-пунктир */
  ctx.beginPath();
  for (var x3 = 0; x3 <= W; x3 += 6) {
    var y3 = groundY(camX + x3 - TX) + 4;
    if (x3 === 0) ctx.moveTo(x3, y3); else ctx.lineTo(x3, y3);
  }
  ctx.setLineDash([16, 26]);
  ctx.lineWidth = 3;
  ctx.strokeStyle = rgba([255, 255, 255], 0.32);
  ctx.stroke();
  ctx.setLineDash([]);

  /* сугробы по краям */
  if (winter > 0.3) {
    for (var sd = 0; sd < 26; sd++) {
      var sx2 = ((sd * 90 - camX) % (W + 200) + W + 200) % (W + 200) - 100;
      var sy2 = groundY(camX + sx2 - TX);
      ctx.fillStyle = 'rgba(255,255,255,' + (0.45 + 0.45 * winter) + ')';
      ctx.beginPath();
      ctx.ellipse(sx2, sy2 - 3, 30 + hash(sd) * 30, 7 + hash(sd * 2) * 8, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawPuddles() {
  if (winter > 0.35) return;        /* зимой лужи под снегом */
  for (var i = 0; i < PUDDLES.length; i++) {
    var p = PUDDLES[i];
    var sx = p.x - camX + TX;
    if (sx < -200 || sx > W + 200) continue;
    var y = groundY(p.x) - 2;
    var wdest = winter > 0.5 ? 0.25 : 1;
    ctx.fillStyle = winter > 0.5 ? 'rgba(226,238,246,.9)' : '#5a4630';
    ctx.globalAlpha = wdest;
    ctx.beginPath(); ctx.ellipse(sx, y, p.w * 0.5, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    if (winter < 0.5) {
      ctx.fillStyle = 'rgba(170,150,120,.5)';
      ctx.beginPath(); ctx.ellipse(sx - p.w * 0.1, y - 3, p.w * 0.2, 4, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function drawApples() {
  for (var i = 0; i < APPLES.length; i++) {
    var a = APPLES[i];
    if (a.taken) continue;
    var sx = a.x - camX + TX;
    if (sx < -60 || sx > W + 60) continue;
    var ay = groundY(a.x) - 30;
    ctx.fillStyle = '#e0453f';
    ctx.beginPath(); ctx.arc(sx, ay, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.arc(sx - 3, ay - 4, 3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#5a3b1f'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sx, ay - 9); ctx.lineTo(sx + 2, ay - 15); ctx.stroke();
  }
}

function drawWashStation() {
  for (var i = 0; i < WASHES.length; i++) {
    var w = WASHES[i];
    var sx = w.x - camX + TX;
    if (sx < -460 || sx > W + 460) continue;
    var gy = groundY(w.x);
    var left = sx - 160, right = sx + 160, top = gy - 250;

    ctx.fillStyle = '#4f8fb8';
    ctx.fillRect(left, top, 16, 250);
    ctx.fillRect(right - 16, top, 16, 250);
    ctx.fillStyle = '#3b82e0';
    ctx.beginPath(); roundRect(ctx, left - 20, top - 30, (right - left) + 40, 34, 12); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 21px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('МОЙКА', sx, top - 7);

    for (var b = 0; b < 3; b++) {
      var bx = sx - 66 + b * 66, by = gy - 120;
      ctx.fillStyle = '#e05c8a';
      ctx.beginPath(); ctx.arc(bx, by, 22, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#c94673'; ctx.lineWidth = 3;
      for (var q = 0; q < 8; q++) {
        var a = q * Math.PI / 4 + (spongeOn || ptr.down ? time * 4 : 0);
        ctx.beginPath();
        ctx.moveTo(bx + Math.cos(a) * 9, by + Math.sin(a) * 9);
        ctx.lineTo(bx + Math.cos(a) * 24, by + Math.sin(a) * 24);
        ctx.stroke();
      }
    }
    ctx.fillStyle = 'rgba(120,190,220,.35)';
    ctx.fillRect(left, gy - 6, right - left, 10);
  }
}

function drawFuelStation() {
  for (var i = 0; i < FUELS.length; i++) {
    var f = FUELS[i];
    var sx = f.x - camX + TX;
    if (sx < -440 || sx > W + 440) continue;
    var gy = groundY(f.x);
    var left = sx - 130, right = sx + 130, top = gy - 220;

    ctx.fillStyle = '#e8eef4';
    ctx.beginPath(); roundRect(ctx, left - 14, top - 30, (right - left) + 28, 28, 9); ctx.fill();
    ctx.fillStyle = '#2f6fd0';
    ctx.beginPath(); roundRect(ctx, left - 14, top - 8, (right - left) + 28, 9, 4); ctx.fill();
    ctx.fillStyle = '#213547';
    ctx.font = 'bold 18px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('АЗС', sx, top - 9);

    ctx.fillStyle = '#9aa7b4';
    ctx.fillRect(left, top - 6, 12, 226);
    ctx.fillRect(right - 12, top - 6, 12, 226);

    /* колонка */
    ctx.fillStyle = '#f4c542';
    ctx.beginPath(); roundRect(ctx, sx - 36, gy - 104, 72, 104, 9); ctx.fill();
    ctx.fillStyle = '#213547';
    ctx.beginPath(); roundRect(ctx, sx - 26, gy - 92, 52, 34, 4); ctx.fill();
    ctx.fillStyle = '#8fd3f4';
    ctx.beginPath(); roundRect(ctx, sx - 21, gy - 87, 42, 24, 3); ctx.fill();

    if (nozzle) {
      ctx.fillStyle = '#213547';
      ctx.font = 'bold 15px "Segoe UI", sans-serif';
      ctx.fillText(Math.round(fuel) + '%', sx, gy - 70);
    }

    ctx.fillStyle = 'rgba(120,140,160,.28)';
    ctx.fillRect(left, gy - 6, right - left, 10);
  }
}

function drawFarm() {
  if (!task) return;
  var sx = taskTarget - camX + TX;
  if (sx < -420 || sx > W + 420) return;
  var gy = groundY(taskTarget);
  ctx.fillStyle = '#c9563f';
  ctx.beginPath(); roundRect(ctx, sx - 104, gy - 150, 208, 150, 6); ctx.fill();
  ctx.fillStyle = '#a8452f';
  ctx.beginPath();
  ctx.moveTo(sx - 120, gy - 148);
  ctx.lineTo(sx, gy - 216);
  ctx.lineTo(sx + 120, gy - 148);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f2e4c9';
  ctx.beginPath(); roundRect(ctx, sx - 38, gy - 110, 76, 110, 4); ctx.fill();
  ctx.strokeStyle = '#b7864f'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(sx, gy - 110); ctx.lineTo(sx, gy); ctx.stroke();
  ctx.strokeStyle = '#7a6a55'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(sx + 92, gy - 214); ctx.lineTo(sx + 92, gy - 266); ctx.stroke();
  var fl = Math.sin(time * 3) * 4;
  ctx.fillStyle = '#f4c542';
  ctx.beginPath();
  ctx.moveTo(sx + 92, gy - 266);
  ctx.lineTo(sx + 130 + fl, gy - 256);
  ctx.lineTo(sx + 92, gy - 244);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.beginPath(); roundRect(ctx, sx - 44, gy - 194, 88, 26, 6); ctx.fill();
  ctx.fillStyle = '#213547';
  ctx.font = 'bold 15px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('ФЕРМА', sx, gy - 176);
}

function drawBirds() {
  if (light < 0.35) return;
  for (var i = 0; i < birds.length; i++) {
    var b = birds[i];
    var flap = Math.sin(time * 9 + b.fl) * 6;
    ctx.strokeStyle = 'rgba(40,50,60,.75)';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(b.x - 9, b.y + flap);
    ctx.quadraticCurveTo(b.x - 4, b.y - 4, b.x, b.y);
    ctx.quadraticCurveTo(b.x + 4, b.y - 4, b.x + 9, b.y + flap);
    ctx.stroke();
  }
}

function drawButterflies() {
  if (winter > 0.35 || light < 0.3) return;
  for (var i = 0; i < butterflies.length; i++) {
    var b = butterflies[i];
    var y = b.y + Math.sin(b.ph) * 10;
    var flap = Math.abs(Math.sin(b.ph * 2)) * 5 + 3;
    ctx.fillStyle = i % 2 ? '#f4c542' : '#ef7d4a';
    ctx.beginPath(); ctx.ellipse(b.x - flap * 0.6, y, flap, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(b.x + flap * 0.6, y, flap, 4, 0, 0, Math.PI * 2); ctx.fill();
  }
}

function drawTracks() {
  for (var i = 0; i < tracks.length; i++) {
    var t = tracks[i];
    var sx = t.x - camX + TX;
    if (sx < -40 || sx > W + 40) continue;
    var y = groundY(t.x) - 3;
    ctx.globalAlpha = 0.38 * clamp(t.life, 0, 1);
    ctx.fillStyle = '#7d8794';
    ctx.beginPath();
    ctx.ellipse(sx, y, 13, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawLeaves() {
  for (var i = 0; i < leaves.length; i++) {
    var l = leaves[i];
    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.rotate(l.rot);
    ctx.fillStyle = l.col;
    ctx.beginPath();
    ctx.ellipse(0, 0, l.r, l.r * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawSnow() {
  for (var i = 0; i < snow.length; i++) {
    var s = snow[i];
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
}

function drawSnowCover() {
  if (snowCover < 2) return;
  var k = clamp(snowCover / 100, 0, 1);
  var h = 6 + 26 * k;
  ctx.fillStyle = 'rgba(255,255,255,' + (0.72 + 0.26 * k) + ')';

  /* большой накапливающийся сугроб на крыше кабины */
  ctx.beginPath();
  ctx.moveTo(-106, -170);
  ctx.quadraticCurveTo(-100, -170 - h * 0.7, -74, -170 - h);
  ctx.quadraticCurveTo(-54, -170 - h * 1.18, -36, -170 - h * 0.85);
  ctx.quadraticCurveTo(-14, -170 - h * 1.05, 4, -170 - h * 0.45);
  ctx.quadraticCurveTo(9, -170 - h * 0.2, 5, -170);
  ctx.closePath();
  ctx.fill();

  /* свес снега с края крыши */
  ctx.beginPath();
  ctx.ellipse(-101, -168, 6 + 5 * k, 4 + 4 * k, 0, 0, Math.PI * 2);
  ctx.fill();

  /* сугроб на борту прицепа */
  ctx.beginPath();
  ctx.moveTo(-306, -130);
  ctx.quadraticCurveTo(-252, -130 - h * 0.55, -200, -130 - h * 0.35);
  ctx.quadraticCurveTo(-142, -130 - h * 0.55, -94, -130);
  ctx.closePath();
  ctx.fill();

  /* снежная кайма вокруг покрышек */
  var wheels = [[-66, -50, 50], [72, -36, 36], [-264, -30, 30], [-146, -30, 30]];
  var n = Math.round(7 + 9 * k);
  for (var w = 0; w < wheels.length; w++) {
    var cx = wheels[w][0], cy = wheels[w][1], r = wheels[w][2];
    for (var i = 0; i < n; i++) {
      var a = i * Math.PI * 2 / n + w * 0.35;
      var px = cx + Math.cos(a) * (r + 1);
      var py = cy + Math.sin(a) * (r + 1);
      var br = 3.5 + 6 * k;
      ctx.beginPath();
      ctx.arc(px, py, br, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawLather() {
  if (lather < 1) return;
  var k = clamp(lather / 45, 0.35, 1);

  /* плотная мыльная пелена под пузырями */
  ctx.globalAlpha = 0.22 + 0.30 * k;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.ellipse(-196, -100, 140, 78, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(-6, -116, 128, 104, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  var n = Math.round(18 + lather * 1.1);
  for (var i = 0; i < n; i++) {
    var lx = -322 + hash(i * 3.11) * 452;
    var ly = -206 + hash(i * 7.73) * 196;
    var r = 12 + hash(i * 5.37) * 20;

    ctx.fillStyle = 'rgba(255,255,255,' + (0.55 + 0.40 * k) + ')';
    ctx.beginPath(); ctx.arc(lx, ly, r, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = 'rgba(232,247,255,' + (0.35 + 0.35 * k) + ')';
    ctx.beginPath(); ctx.arc(lx - r * 0.28, ly - r * 0.28, r * 0.6, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = 'rgba(168,212,238,' + (0.25 + 0.30 * k) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(lx, ly, r, 0, Math.PI * 2); ctx.stroke();
  }
}

function blob(ctx, x, y, r, seed) {
  var lobes = 5;
  ctx.beginPath();
  for (var i = 0; i < lobes; i++) {
    var a = i * Math.PI * 2 / lobes + seed;
    var rr = r * (0.55 + hash(seed * 1.3 + i * 2.1) * 0.6);
    var cx = x + Math.cos(a) * r * 0.45;
    var cy = y + Math.sin(a) * r * 0.4;
    ctx.moveTo(cx + rr, cy);
    ctx.arc(cx, cy, rr, 0, Math.PI * 2);
  }
  ctx.fill();
}

function drawWheelMud() {
  if (dirt < 16) return;
  var k = clamp(dirt / 100, 0, 1);
  var wheels = [
    [-66, -50, 50, 1], [72, -36, 36, 2],
    [-264, -30, 30, 3], [-146, -30, 30, 4]
  ];
  for (var w = 0; w < wheels.length; w++) {
    var cx = wheels[w][0], cy = wheels[w][1], rr = wheels[w][2], seed = wheels[w][3];
    var n = Math.round(5 + 8 * k);
    for (var i = 0; i < n; i++) {
      var ang = hash(seed * 13.7 + i * 3.3) * Math.PI * 2;
      var dist = rr * (0.82 + hash(i * 5.1 + seed) * 0.3);
      var px = cx + Math.cos(ang) * dist;
      var py = cy + Math.sin(ang) * dist;
      var br = 4 + hash(i * 7.9 + seed) * 7 * (0.6 + k);
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = C_DIRT_D;
      blob(ctx, px, py, br, i + seed * 10);
      ctx.fillStyle = C_DIRT;
      blob(ctx, px - 1, py - 1, br * 0.72, i + seed * 10 + 2.2);
    }
  }
  ctx.globalAlpha = 1;
}

function drawSpots() {
  for (var i = 0; i < spots.length; i++) {
    var s = spots[i];
    var a = clamp(s.a, 0, 1);
    var r = s.r * (0.75 + 0.35 * a);
    var sd = s.sd || i;

    ctx.globalAlpha = 0.62 + 0.36 * a;
    ctx.fillStyle = C_DIRT_D;
    blob(ctx, s.lx, s.ly, r * 1.12, sd);

    ctx.fillStyle = C_DIRT;
    blob(ctx, s.lx, s.ly, r * 0.85, sd + 3.3);

    ctx.globalAlpha = (0.5 + 0.4 * a) * 0.55;
    ctx.fillStyle = C_DIRT_L;
    blob(ctx, s.lx - r * 0.22, s.ly - r * 0.26, r * 0.34, sd + 7.1);
  }
  ctx.globalAlpha = 1;
}

function drawParticles() {
  for (var i = 0; i < mud.length; i++) {
    var p = mud[i];
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = C_DIRT;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (var f = 0; f < foam.length; f++) {
    var fo = foam[f];
    ctx.globalAlpha = clamp(fo.life, 0, 1) * 0.85;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(fo.x, fo.y, fo.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(160,205,230,.9)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(fo.x, fo.y, fo.r, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (var s = 0; s < sparks.length; s++) {
    ctx.globalAlpha = clamp(sparks[s].life, 0, 1);
    ctx.fillStyle = '#ffe9a8';
    star(ctx, sparks[s].x, sparks[s].y, 4);
  }
  ctx.globalAlpha = 1;
  for (var c = 0; c < confetti.length; c++) {
    var cf = confetti[c];
    ctx.globalAlpha = clamp(cf.life, 0, 1);
    ctx.save();
    ctx.translate(cf.x, cf.y); ctx.rotate(cf.rot);
    ctx.fillStyle = cf.c;
    ctx.fillRect(-4, -2.5, 8, 5);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function star(ctx, x, y, r) {
  ctx.beginPath();
  for (var i = 0; i < 8; i++) {
    var a = i * Math.PI / 4;
    var rr = i % 2 ? r * 0.4 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
}

function drawSponge() {
  if (!spongeOn || ptr.x < 0) return;
  ctx.save();
  ctx.translate(ptr.x + 16, ptr.y + 12);
  ctx.rotate(-0.35);
  ctx.fillStyle = '#f4d35e';
  ctx.beginPath(); roundRect(ctx, -30, -16, 60, 32, 9); ctx.fill();
  ctx.fillStyle = '#e0b93c';
  ctx.beginPath(); roundRect(ctx, -30, 4, 60, 12, 6); ctx.fill();
  ctx.fillStyle = '#5fa8d3';
  ctx.beginPath(); roundRect(ctx, -30, -18, 60, 10, 5); ctx.fill();
  ctx.restore();
}

function drawJet() {
  if (!spraying || ptr.x < 0) return;
  var t = tractorTilts();
  var nx = TX + Math.cos(t.ang) * 120 + Math.sin(t.ang) * -70;
  var ny = t.y + Math.sin(t.ang) * 120 + Math.cos(t.ang) * -70;

  var g = ctx.createLinearGradient(nx, ny, ptr.x, ptr.y);
  g.addColorStop(0, 'rgba(200,235,255,.95)');
  g.addColorStop(1, 'rgba(120,200,240,.45)');
  ctx.lineCap = 'round';
  ctx.strokeStyle = g;
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(nx, ny);
  ctx.quadraticCurveTo((nx + ptr.x) / 2, Math.min(ny, ptr.y) - 22, ptr.x, ptr.y);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.7)';
  ctx.lineWidth = 4;
  ctx.stroke();
  ctx.fillStyle = 'rgba(150,210,240,.25)';
  ctx.beginPath(); ctx.ellipse(ptr.x, groundY(camX + ptr.x - TX) - 4, 34, 7, 0, 0, Math.PI * 2); ctx.fill();
}

function drawHeadlights() {
  var t = tractorTilts();
  var nightK = clamp(1 - light * 1.7, 0, 1);
  if (nightK < 0.05) return;
  ctx.save();
  ctx.translate(TX, t.y);
  ctx.rotate(t.ang);
  ctx.globalCompositeOperation = 'lighter';
  var g = ctx.createLinearGradient(110, -74, 460, -120);
  g.addColorStop(0, 'rgba(255,240,180,' + (0.5 * nightK) + ')');
  g.addColorStop(1, 'rgba(255,240,180,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(108, -82);
  ctx.lineTo(470, -190);
  ctx.lineTo(500, -40);
  ctx.lineTo(108, -62);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';
}

function drawNightOverlay() {
  var k = clamp(1 - light, 0, 1);
  if (k < 0.03) return;
  ctx.fillStyle = 'rgba(12,20,48,' + (k * 0.5) + ')';
  ctx.fillRect(0, 0, W, H);
}

function render() {
  ctx.clearRect(0, 0, W, H);
  drawSky();
  drawHills(0.18, 330, 26, rgba(mixC([150, 190, 170], [200, 214, 226], winter), 0.55));
  drawHills(0.42, 378, 22, rgba(mixC([122, 176, 128], [214, 228, 238], winter), 0.8));

  /* дальний лес */
  for (var i = 0; i < TREES_FAR.length; i++) {
    var tf = TREES_FAR[i];
    var fx = tf.x - camX * tf.par;
    fx = ((fx % (W + 240)) + W + 240) % (W + 240) - 120;
    drawTree(fx, 372 + Math.sin((fx + camX * 0.18) / 300) * 10, tf.s * 0.8, tf.kind, 0.45);
  }

  drawGroundAndRoad();
  drawTracks();

  /* средний лес (за дорогой) */
  for (var j = 0; j < TREES_MID.length; j++) {
    var tm = TREES_MID[j];
    var mx = tm.x - camX * tm.par + TX * (1 - tm.par);
    if (mx < -100 || mx > W + 100) continue;
    var my = groundY(camX * tm.par + mx - TX * (1 - tm.par)) - 8;
    drawTree(mx, my - 6, tm.s, tm.kind, tm.par);
  }

  drawPuddles();
  drawWashStation();
  drawFuelStation();
  drawFarm();
  drawApples();

  /* прицеп и трактор */
  var t = tractorTilts();
  ctx.save();
  ctx.translate(TX, t.y);
  ctx.rotate(t.ang);
  drawTrailer(ctx, 0, 0, wheelAng, task ? task.animals : []);
  drawSmokePuff();
  drawTractor(ctx, 0, 0, wheelAng, 0);
  drawSpots();
  drawWheelMud();
  drawSnowCover();
  drawLather();
  ctx.restore();

  /* ближний лес и кусты перед дорогой */
  for (var k = 0; k < BUSHES.length; k++) {
    var bu = BUSHES[k];
    var bx = bu.x - camX + TX;
    if (bx < -60 || bx > W + 60) continue;
    drawBush(bx, groundY(camX + bx - TX) + 14, bu.s);
  }
  for (var m = 0; m < TREES_NEAR.length; m++) {
    var tn = TREES_NEAR[m];
    var nx2 = tn.x - camX + TX;
    if (nx2 < -100 || nx2 > W + 100) continue;
    if (Math.abs(nx2 - TX) < 150) continue;
    drawTree(nx2, groundY(camX + nx2 - TX) + 10, tn.s, tn.kind, 1);
  }

  drawBirds();
  drawButterflies();
  drawParticles();
  drawSnow();
  drawLeaves();
  drawNightOverlay();
  drawHeadlights();
  drawFuelHose();
  drawJet();
  drawSponge();

  if (msgTimer > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(msgTimer, 0, 1);
    ctx.fillStyle = 'rgba(33,53,71,.86)';
    ctx.beginPath(); roundRect(ctx, W / 2 - 210, 250, 420, 62, 16); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(msgText, W / 2, 290);
    ctx.restore();
  }
  ctx.textAlign = 'left';
}

function drawSmokePuff() {
  var puff = (time * 1.3) % 1;
  ctx.globalAlpha = 0.3 * (1 - puff);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(26, -234 - puff * 44, 7 + puff * 12, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

/* ---------------- цвета ---------------- */
var C_BODY = '#2f6fd0', C_BODY_L = '#4a8ae8', C_BODY_D = '#1f4c92';
var C_CAB = '#3b82e0', C_WIN = '#cbe8ff', C_TIRE = '#26262a', C_RIM = '#aab3bd';
var C_PIPE = '#71787f', C_LIGHT = '#ffe9a8';
var C_DIRT = '#b45f10', C_DIRT_D = '#6f3703', C_DIRT_L = '#e79a3c';
var C_WOOD = '#c8934f', C_WOOD_D = '#a2733a';

/* ---------------- животные ---------------- */
var ANIMALS = {
  cow:     { name: 'корова', body: '#f6f2ea', dark: '#2a2a2a', ear: '#e2a0a0' },
  pig:     { name: 'свинья', body: '#f2a8b8', dark: '#d57f95', ear: '#e08fa4' },
  chicken: { name: 'курица', body: '#fdf6e3', dark: '#e8a33d', ear: '#d94f4f' },
  sheep:   { name: 'овца', body: '#fbf8f2', dark: '#3c3c40', ear: '#efe6d6' },
  goat:    { name: 'коза', body: '#ddd6c8', dark: '#6b6459', ear: '#cbc2b0' },
  horse:   { name: 'лошадь', body: '#a9743f', dark: '#5e3d1c', ear: '#8f5f31' },
  duck:    { name: 'утка', body: '#fbfbf6', dark: '#f2a23c', ear: '#e2ded0' }
};

function drawAnimal(ctx, kind, x, y, s) {
  var a = ANIMALS[kind] || ANIMALS.cow;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);

  ctx.strokeStyle = a.dark; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
  for (var i = 0; i < 2; i++) {
    ctx.beginPath();
    ctx.moveTo(-10 + i * 22, 6);
    ctx.lineTo(-10 + i * 22, 20);
    ctx.stroke();
  }

  ctx.fillStyle = a.body;
  ctx.beginPath(); ctx.ellipse(0, 0, 24, 15, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1.2; ctx.stroke();

  if (kind === 'cow') {
    ctx.fillStyle = '#2a2a2a';
    ctx.beginPath(); ctx.ellipse(-8, -3, 7, 5, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(9, 4, 5, 4, -0.2, 0, Math.PI * 2); ctx.fill();
  }
  if (kind === 'sheep') {
    ctx.fillStyle = '#ffffff';
    for (var k = 0; k < 6; k++) {
      ctx.beginPath(); ctx.arc(-16 + k * 7, -6 + (k % 2) * 8, 7, 0, Math.PI * 2); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(0,0,0,.10)'; ctx.lineWidth = 1;
    for (var k2 = 0; k2 < 6; k2++) {
      ctx.beginPath(); ctx.arc(-16 + k2 * 7, -6 + (k2 % 2) * 8, 7, 0, Math.PI * 2); ctx.stroke();
    }
  }
  if (kind === 'horse') {
    ctx.fillStyle = a.dark;
    ctx.beginPath(); ctx.ellipse(-4, -10, 14, 5, -0.15, 0, Math.PI * 2); ctx.fill();
  }

  ctx.fillStyle = a.body;
  ctx.beginPath();
  ctx.ellipse(24, -8, 11, 9, kind === 'horse' ? -0.5 : 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1.2; ctx.stroke();

  ctx.fillStyle = a.ear;
  if (kind === 'cow' || kind === 'goat' || kind === 'sheep') {
    ctx.beginPath(); ctx.ellipse(19, -16, 5, 3, -0.6, 0, Math.PI * 2); ctx.fill();
  }
  if (kind === 'cow') {
    ctx.strokeStyle = '#d8cfc0'; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(26, -16); ctx.lineTo(30, -22); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(20, -16); ctx.lineTo(17, -22); ctx.stroke();
  }
  if (kind === 'goat') {
    ctx.strokeStyle = '#8c8578'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(24, -15); ctx.lineTo(22, -24); ctx.stroke();
  }
  if (kind === 'chicken') {
    ctx.fillStyle = '#d94f4f';
    ctx.beginPath(); ctx.arc(22, -18, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(27, -17, 3, 0, Math.PI * 2); ctx.fill();
  }
  if (kind === 'horse') {
    ctx.fillStyle = a.dark;
    ctx.beginPath(); ctx.ellipse(20, -14, 4, 3, -0.4, 0, Math.PI * 2); ctx.fill();
  }

  ctx.fillStyle = '#2b2b2b';
  ctx.beginPath(); ctx.arc(27, -10, 1.9, 0, Math.PI * 2); ctx.fill();

  if (kind === 'chicken' || kind === 'duck') {
    ctx.fillStyle = a.dark;
    ctx.beginPath();
    ctx.moveTo(33, -8); ctx.lineTo(40, -6); ctx.lineTo(33, -4);
    ctx.closePath(); ctx.fill();
  }
  if (kind === 'pig') {
    ctx.fillStyle = a.dark;
    ctx.beginPath(); ctx.ellipse(33, -7, 4.5, 4, 0, 0, Math.PI * 2); ctx.fill();
  }

  ctx.strokeStyle = a.dark; ctx.lineWidth = 2.4;
  ctx.beginPath();
  if (kind === 'pig') { ctx.arc(-27, -2, 4, 0.3, 4.2); }
  else { ctx.moveTo(-24, -4); ctx.lineTo(-30, 6); }
  ctx.stroke();

  ctx.restore();
}

/* ---------------- трактор ---------------- */
function roundRect(ctx, x, y, w, h, r) {
  var rr = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function wheel(ctx, cx, cy, r, ang, treads) {
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = C_TIRE; ctx.fill();

  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(ang);
  ctx.strokeStyle = '#3a3a3e'; ctx.lineWidth = Math.max(2, r * 0.13);
  var cnt = treads || 8;
  for (var i = 0; i < cnt; i++) {
    var a = i * (Math.PI * 2 / cnt);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * 0.8, Math.sin(a) * r * 0.8);
    ctx.lineTo(Math.cos(a) * r * 0.99, Math.sin(a) * r * 0.99);
    ctx.stroke();
  }
  ctx.restore();

  var g = ctx.createRadialGradient(cx - r * 0.2, cy - r * 0.2, r * 0.1, cx, cy, r * 0.55);
  g.addColorStop(0, '#dfe6ec'); g.addColorStop(1, C_RIM);
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.5, 0, Math.PI * 2);
  ctx.fillStyle = g; ctx.fill();

  ctx.fillStyle = '#8b949e';
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.17, 0, Math.PI * 2); ctx.fill();

  ctx.strokeStyle = '#98a2ac'; ctx.lineWidth = Math.max(2, r * 0.08);
  for (var k = 0; k < 5; k++) {
    var a2 = ang + k * Math.PI * 2 / 5;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a2) * r * 0.18, cy + Math.sin(a2) * r * 0.18);
    ctx.lineTo(cx + Math.cos(a2) * r * 0.46, cy + Math.sin(a2) * r * 0.46);
    ctx.stroke();
  }
  ctx.restore();
}

function drawTractor(ctx, bx, by, ang, dirt) {
  var rearX = bx - 66, rearY = by - 50, rearR = 50;
  var frontX = bx + 72, frontY = by - 36, frontR = 36;

  ctx.save();
  ctx.globalAlpha = 0.18; ctx.fillStyle = '#1b3a52';
  ctx.beginPath(); ctx.ellipse(bx - 20, by + 4, 135, 13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  wheel(ctx, frontX, frontY, frontR, ang * 1.4, 6);

  ctx.fillStyle = C_BODY_D;
  ctx.beginPath(); roundRect(ctx, bx - 106, by - 60, 160, 18, 7); ctx.fill();

  var bg = ctx.createLinearGradient(0, by - 100, 0, by - 56);
  bg.addColorStop(0, C_BODY_L); bg.addColorStop(0.55, C_BODY); bg.addColorStop(1, C_BODY_D);
  ctx.fillStyle = bg;
  ctx.beginPath(); roundRect(ctx, bx - 102, by - 98, 152, 44, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(18,48,96,.55)'; ctx.lineWidth = 3; ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(bx - 92, by - 95); ctx.lineTo(bx + 36, by - 95); ctx.stroke();

  var cg = ctx.createLinearGradient(0, by - 160, 0, by - 96);
  cg.addColorStop(0, '#5a9bf0'); cg.addColorStop(1, C_CAB);
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.moveTo(bx - 94, by - 98);
  ctx.lineTo(bx - 94, by - 152);
  ctx.quadraticCurveTo(bx - 94, by - 162, bx - 84, by - 162);
  ctx.lineTo(bx - 12, by - 162);
  ctx.quadraticCurveTo(bx - 4, by - 162, bx - 4, by - 152);

  ctx.closePath(); ctx.fill();

  var wg = ctx.createLinearGradient(bx - 82, by - 150, bx - 20, by - 104);
  wg.addColorStop(0, '#e8f6ff'); wg.addColorStop(0.5, C_WIN); wg.addColorStop(1, '#9fd0f5');
  ctx.fillStyle = wg;

  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.beginPath();
  ctx.moveTo(bx - 76, by - 146); ctx.lineTo(bx - 58, by - 146);
  ctx.lineTo(bx - 76, by - 112); ctx.closePath(); ctx.fill();

  ctx.strokeStyle = 'rgba(31,76,146,.5)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(bx - 88, by - 100); ctx.lineTo(bx - 88, by - 150); ctx.stroke();
  ctx.fillStyle = '#cfe0f5';
  ctx.beginPath(); roundRect(ctx, bx - 78, by - 118, 14, 5, 2); ctx.fill();

  ctx.fillStyle = C_BODY;
  ctx.beginPath(); roundRect(ctx, bx - 102, by - 174, 104, 14, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); roundRect(ctx, bx - 98, by - 172, 96, 4, 2); ctx.fill();

  var hg = ctx.createLinearGradient(0, by - 94, 0, by - 58);
  hg.addColorStop(0, C_BODY_L); hg.addColorStop(1, C_BODY);
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.moveTo(bx + 50, by - 94);
  ctx.lineTo(bx + 108, by - 94);
  ctx.quadraticCurveTo(bx + 120, by - 94, bx + 120, by - 82);
  ctx.lineTo(bx + 120, by - 60);
  ctx.lineTo(bx + 50, by - 60);
  ctx.closePath(); ctx.fill();

  drawFace(ctx, bx, by);

  // выхлопная труба
  ctx.fillStyle = C_PIPE;
  ctx.beginPath(); roundRect(ctx, bx + 16, by - 212, 16, 120, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.38)';
  ctx.beginPath(); roundRect(ctx, bx + 19, by - 206, 4, 108, 2); ctx.fill();
  ctx.fillStyle = '#565d64';
  ctx.beginPath(); roundRect(ctx, bx + 11, by - 198, 26, 9, 4); ctx.fill();
  ctx.beginPath(); roundRect(ctx, bx + 11, by - 128, 26, 9, 4); ctx.fill();
  // раструб
  ctx.fillStyle = '#4b5157';
  ctx.beginPath();
  ctx.moveTo(bx + 11, by - 212);
  ctx.lineTo(bx + 37, by - 212);
  ctx.lineTo(bx + 42, by - 226);
  ctx.lineTo(bx + 6, by - 226);
  ctx.closePath(); ctx.fill();

  /* большое заднее колесо — снаружи, поверх корпуса и кабины */
  ctx.strokeStyle = '#3a3f45'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(bx - 90, by - 58); ctx.lineTo(bx - 90, by - 30); ctx.stroke();
  wheel(ctx, rearX, rearY, rearR, ang, 10);

  ctx.strokeStyle = C_BODY_D; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(rearX, rearY, rearR + 10, Math.PI * 1.02, Math.PI * 1.98); ctx.stroke();


  // пятна грязи теперь отдельные объекты — рисуются в drawDirtSpots()

}

/* ---------------- прицеп ---------------- */
function drawTrailer(ctx, bx, by, ang, animals) {
  var frontX = bx - 108;
  var bodyR = frontX + 14;
  var bodyL = bodyR - 214;
  var bodyTop = by - 124;
  var bodyBottom = by - 58;

  ctx.strokeStyle = '#3a3f45'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(frontX + 4, by - 66);
  ctx.lineTo(frontX - 26, by - 58);
  ctx.stroke();
  ctx.fillStyle = '#5a6169';
  ctx.beginPath(); ctx.arc(frontX - 26, by - 58, 5, 0, Math.PI * 2); ctx.fill();

  ctx.save();
  ctx.globalAlpha = 0.16; ctx.fillStyle = '#1b3a52';
  ctx.beginPath();
  ctx.ellipse((bodyL + bodyR) / 2, by + 4, 118, 11, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  /* животные — до борта: борт закроет им ноги */
  if (animals && animals.length) {
    var n = animals.length;
    var inner = (bodyR - bodyL) - 26;
    var slot = inner / n;
    var s = Math.min(1.28, slot / 60);
    for (var i = 0; i < n; i++) {
      var ax = bodyL + 13 + slot * (i + 0.5);
      drawAnimal(ctx, animals[i], ax, bodyTop - 6, s);
    }
  }

  ctx.fillStyle = '#4a5058';
  ctx.beginPath(); roundRect(ctx, bodyL - 8, bodyBottom - 6, (bodyR - bodyL) + 16, 12, 5); ctx.fill();

  /* непрозрачный кузов */
  var wg = ctx.createLinearGradient(0, bodyTop, 0, bodyBottom);
  wg.addColorStop(0, C_WOOD); wg.addColorStop(1, C_WOOD_D);
  ctx.fillStyle = wg;
  ctx.beginPath(); roundRect(ctx, bodyL, bodyTop, bodyR - bodyL, bodyBottom - bodyTop, 8); ctx.fill();

  ctx.strokeStyle = 'rgba(120,80,30,.45)'; ctx.lineWidth = 1.6;
  for (var x = bodyL + 18; x < bodyR - 6; x += 18) {
    ctx.beginPath(); ctx.moveTo(x, bodyTop + 4); ctx.lineTo(x, bodyBottom - 4); ctx.stroke();
  }
  ctx.strokeStyle = '#8a5f2c'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(bodyL + 2, bodyTop + 10); ctx.lineTo(bodyR - 2, bodyTop + 10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bodyL + 2, bodyBottom - 10); ctx.lineTo(bodyR - 2, bodyBottom - 10); ctx.stroke();

  ctx.fillStyle = '#d9a662';
  ctx.beginPath(); roundRect(ctx, bodyL - 4, bodyTop - 8, (bodyR - bodyL) + 8, 14, 6); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  ctx.beginPath(); roundRect(ctx, bodyL, bodyTop - 6, (bodyR - bodyL), 4, 2); ctx.fill();

  wheel(ctx, bodyL + 44, by - 30, 30, ang * 1.2, 7);
  wheel(ctx, bodyR - 52, by - 30, 30, ang * 1.2, 7);

  ctx.fillStyle = '#e05c5c';
  ctx.beginPath(); roundRect(ctx, bodyL - 6, bodyBottom - 22, 7, 10, 3); ctx.fill();
}

  lctx.beginPath(); lctx.arc(-66, -46, 46, 0, Math.PI * 2); lctx.stroke();

  lctx.beginPath(); lctx.arc(70, -32, 32, 0, Math.PI * 2); lctx.stroke();
  lctx.beginPath(); lctx.arc(70, -32, 14, 0, Math.PI * 2); lctx.stroke();

  lctx.beginPath();
  lctx.moveTo(-94, -98); lctx.lineTo(-94, -152);
  lctx.quadraticCurveTo(-94, -162, -84, -162);
  lctx.lineTo(-12, -162);
  lctx.quadraticCurveTo(-4, -162, -4, -152);
  lctx.lineTo(-4, -98);
  lctx.closePath(); lctx.stroke();

  lctx.beginPath(); lctx.rect(-82, -152, 64, 44); lctx.stroke();
  lctx.beginPath(); lctx.rect(-102, -174, 104, 14); lctx.stroke();
  lctx.beginPath(); roundRect(lctx, -102, -98, 152, 44, 12); lctx.stroke();

  lctx.beginPath();
  lctx.moveTo(50, -94); lctx.lineTo(108, -94);

  lctx.beginPath(); lctx.arc(112, -74, 10, 0, Math.PI * 2); lctx.stroke();
  lctx.beginPath(); lctx.rect(-120, -178, 13, 80); lctx.stroke();

  lctx.beginPath(); roundRect(lctx, -360, -132, 214, 70, 8); lctx.stroke();
  lctx.beginPath(); lctx.arc(-316, -30, 30, 0, Math.PI * 2); lctx.stroke();

  lctx.restore();

  lineData = lctx.getImageData(0, 0, PW, PH).data;

}

function isLine(data, idx) {
  return data[idx + 3] > 90 && (data[idx] < 160 || data[idx + 1] < 160 || data[idx + 2] < 160);
}

function floodFill(sx, sy) {
  if (!lineData) return;
  var img = pctx.getImageData(0, 0, PW, PH);
  var d = img.data;
  var start = (sy * PW + sx) * 4;
  if (isLine(lineData, start)) return;

  var rgb = hexToRgb(curColor);
  var stack = [sy * PW + sx];
  var seen = new Uint8Array(PW * PH);

  while (stack.length) {
    var idx = stack.pop();
    if (seen[idx]) continue;
    seen[idx] = 1;
    var p = idx * 4;
    if (isLine(lineData, p)) continue;

    d[p] = rgb.r; d[p + 1] = rgb.g; d[p + 2] = rgb.b; d[p + 3] = 255;

    var x = idx % PW, y = (idx - x) / PW;
    if (x > 0) stack.push(idx - 1);
    if (x < PW - 1) stack.push(idx + 1);
    if (y > 0) stack.push(idx - PW);
    if (y < PH - 1) stack.push(idx + PW);
  }
  pctx.putImageData(img, 0, 0);
}

function hexToRgb(h) {
  return { r: parseInt(h.slice(1, 3), 16), g: parseInt(h.slice(3, 5), 16), b: parseInt(h.slice(5, 7), 16) };
}

function paintAt(clientX, clientY) {
  var r = paintCv.getBoundingClientRect();
  var x = Math.round((clientX - r.left) * (PW / r.width));
  var y = Math.round((clientY - r.top) * (PH / r.height));
  if (x < 0 || y < 0 || x >= PW || y >= PH) return;
  floodFill(x, y);
}

paintCv.addEventListener('click', function (e) { paintAt(e.clientX, e.clientY); });
paintCv.addEventListener('touchstart', function (e) {
  if (e.touches[0]) { e.preventDefault(); paintAt(e.touches[0].clientX, e.touches[0].clientY); }

    try {
      update(dt);
      render();
    } catch (e) {
      if (!window.__frameErr) {
        window.__frameErr = true;
        var box = document.getElementById('err');
        if (box) {
          box.style.display = 'block';
          box.textContent = 'Ошибка кадра: ' + (e && e.message ? e.message : e);
        }
      }
    }
  }
  requestAnimationFrame(loop);
}

render();
requestAnimationFrame(loop);
</script>
</body>
</html>
